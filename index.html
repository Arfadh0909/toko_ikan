<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Petshop & Aquarium 99</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f5f0] font-sans antialiased h-screen flex flex-col lg:flex-row overflow-hidden">

  <!-- SISI KIRI: Banner Kucing & Kolam Ikan -->
  <div class="relative w-full lg:w-7/12 h-64 lg:h-full flex flex-col justify-between p-6 lg:p-10 bg-slate-900 overflow-hidden">
    <!-- Menggunakan link gambar langsung yang stabil -->
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1518791841217-8f162f1e1131?q=80&w=1600&auto=format&fit=crop');"></div>
    <div class="absolute inset-0 bg-black/20"></div>

    <!-- Navigasi Atas -->
    <div class="relative z-10 hidden sm:flex items-center justify-between text-white/90 text-xs tracking-wider font-semibold">
      <span class="tracking-widest bg-black/40 px-3 py-1.5 rounded-lg backdrop-blur-md">PETSHOP & AQUARIUM 99</span>
      <div class="flex items-center gap-6 bg-black/40 px-4 py-1.5 rounded-lg backdrop-blur-md">
        <a href="#" class="hover:text-white transition">Features</a>
        <span>|</span>
        <a href="#" class="hover:text-white transition">About</a>
        <span>|</span>
        <a href="#" class="hover:text-white transition">Contact</a>
      </div>
    </div>

    <!-- Teks Sambutan di Bawah Kiri -->
    <div class="relative z-10 max-w-lg text-white hidden lg:block pb-4">
      <h2 class="text-2xl font-bold mb-2">Petshop & Aquarium 99</h2>
      <p class="text-xs text-slate-100 leading-relaxed font-medium bg-black/30 p-3 rounded-xl backdrop-blur-sm">
        Menjaga keindahan ekosistem hewan kesayangan dan ikan hias Anda dengan sistem manajemen modern dan terintegrasi.
      </p>
    </div>
  </div>

  <!-- SISI KANAN: Kotak Form Login Estetik -->
  <div class="w-full lg:w-5/12 flex items-center justify-center p-6 lg:p-12 bg-[#faf8f5] relative h-full overflow-y-auto">
    
    <!-- Kartu Form Login -->
    <div class="w-full max-w-sm bg-white/90 backdrop-blur-xl border border-[#e6e2d8] rounded-3xl p-8 shadow-2xl relative">
      
      <!-- Logo / Header Brand di Form -->
      <div class="text-center mb-6">
        <h1 class="text-base font-extrabold tracking-widest text-[#2c2825] uppercase leading-tight">Petshop &<br>Aquarium 99</h1>
        <p class="text-[10px] tracking-widest font-bold text-slate-400 uppercase mt-1">LOGIN</p>
      </div>

      <!-- Form Login Utama -->
      <form id="login-form" class="space-y-4">
        
        <!-- Input Username / Email -->
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-xs">🐱</span>
          <input type="text" id="login-username" required class="w-full bg-[#fcfbfa] border border-[#e3dcd0] rounded-xl pl-10 pr-3.5 py-2.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-slate-800 transition shadow-sm" placeholder="Username/Email">
        </div>

        <!-- Input Password -->
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-xs">🔑</span>
          <input type="password" id="login-password" required class="w-full bg-[#fcfbfa] border border-[#e3dcd0] rounded-xl pl-10 pr-3.5 py-2.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-slate-800 transition shadow-sm" placeholder="Password">
        </div>

        <!-- Opsi Remember me & Forgot Password -->
        <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1 px-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" class="rounded border-slate-300 text-slate-800 focus:ring-0 w-3.5 h-3.5">
            <span>Remember me</span>
          </label>
          <a href="#" class="hover:text-slate-800 transition">Forgot Password?</a>
        </div>

        <!-- Tombol CONNECT -->
        <button type="submit" class="w-full bg-gradient-to-r from-[#205273] to-[#2b678f] hover:from-[#19405a] hover:to-[#205273] text-white font-bold py-3 rounded-xl text-xs tracking-wider transition cursor-pointer shadow-md uppercase mt-2">
          CONNECT
        </button>

        <!-- Pemisah / Garis -->
        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-4 text-[10px] text-slate-400 uppercase">Atau</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Tombol Login with Google -->
        <button type="button" onclick="alert('Fitur Google Login dapat diintegrasikan.')" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2.5 px-4 rounded-xl text-xs border border-slate-200 transition flex items-center justify-center gap-2 shadow-sm cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.14v3.15C3.15 21.36 7.23 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.14C.41 8.08 0 9.75 0 12s.41 3.92 1.14 5.4l4.14-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.64 1.14 6.6l4.14 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/>
          </svg>
          Login with Google
        </button>

        <!-- Tautan Buat Akun -->
        <div class="text-center pt-2">
          <a href="#" class="text-[11px] text-slate-500 hover:text-slate-800 transition">Create Account</a>
        </div>

      </form>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
