<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir - Aquarium & Petshop 99</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- Header / Navbar Atas -->
  <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex justify-between items-center shrink-0 shadow-sm z-10">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 text-white font-bold p-2.5 rounded-2xl text-xs shadow-md">A99</div>
      <div>
        <h2 class="font-bold text-slate-800 text-xs tracking-wide">Kasir Toko</h2>
        <p class="text-[10px] text-slate-400 font-medium">Aquarium & Petshop 99</p>
      </div>
    </div>

    <!-- Tombol Tab Khusus HP & Status User -->
    <div class="flex items-center gap-3">
      <div class="flex lg:hidden bg-slate-100 p-1 rounded-xl">
        <button onclick="gantiTabMobile('produk')" id="tab-btn-produk" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white transition">Produk</button>
        <button onclick="gantiTabMobile('keranjang')" id="tab-btn-keranjang" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 transition relative">
          Keranjang <span id="badge-qty-mobile" class="bg-red-500 text-white rounded-full px-1.5 text-[9px] ml-0.5">0</span>
        </button>
      </div>
      <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-3.5 py-2 rounded-xl text-xs font-semibold transition cursor-pointer">Keluar</button>
    </div>
  </header>

  <!-- Layout Utama -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- SISI KIRI: Daftar Produk, Kategori & Pencarian -->
    <div id="panel-produk" class="flex-1 flex flex-col p-6 overflow-hidden bg-slate-50/50 w-full">
      <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center mb-5 gap-3 shrink-0">
        <!-- Kategori Navigasi -->
        <div class="flex gap-2 overflow-x-auto pb-1 md:pb-0">
          <button id="nav-semua" onclick="pilihKategoriKasir('semua')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white shadow transition cursor-pointer whitespace-nowrap">Semua</button>
          <button id="nav-ikan" onclick="pilihKategoriKasir('ikan')" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 transition cursor-pointer whitespace-nowrap">Ikan</button>
          <button id="nav-barang" onclick="pilihKategoriKasir('barang')" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 transition cursor-pointer whitespace-nowrap">Barang</button>
          <button id="nav-aquarium" onclick="pilihKategoriKasir('aquarium')" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 transition cursor-pointer whitespace-nowrap">Aquarium</button>
        </div>
        
        <!-- Kolom Pencarian -->
        <div class="relative w-full md:w-72">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">🔍</span>
          <input type="text" id="input-pencarian" oninput="renderKasirProduk()" onkeydown="handleSearchEnter(event)" placeholder="Cari produk..." class="bg-white border border-slate-200 rounded-2xl pl-10 pr-4 py-2 text-xs focus:outline-none focus:border-blue-600 w-full shadow-sm">
        </div>
      </div>

      <h3 id="judul-kategori-aktif" class="font-bold text-slate-800 text-sm mb-3.5 shrink-0">Semua Produk</h3>

      <!-- Grid Produk Sesuai Referensi -->
      <div id="produk-list-kasir" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 overflow-y-auto flex-1 pr-1 pb-20">
        <!-- Produk dirender otomatis via JS -->
      </div>
    </div>

    <!-- SISI KANAN: Keranjang Belanja & Pembayaran -->
    <div id="panel-keranjang" class="hidden lg:flex w-96 bg-white border-l border-slate-200 flex-col p-6 shrink-0 h-full shadow-xl z-20 absolute lg:relative inset-0 lg:inset-auto">
      <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3 shrink-0">
        <h3 class="font-bold text-slate-800 text-sm">Keranjang Belanja</h3>
        <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
          <button id="btn-eceran" onclick="setTipePenjualan('eceran')" class="px-3 py-1 rounded-lg font-semibold text-xs bg-blue-600 text-white shadow transition cursor-pointer">Eceran</button>
          <button id="btn-grosir" onclick="setTipePenjualan('grosir')" class="px-3 py-1 rounded-lg font-semibold text-xs text-slate-600 transition cursor-pointer">Grosir</button>
        </div>
      </div>

      <!-- Daftar Item di Keranjang -->
      <div id="keranjang-list" class="space-y-3 overflow-y-auto flex-1 pr-1 mb-4">
        <!-- Item keranjang dirender otomatis via JS -->
      </div>

      <!-- Bagian Total & Tombol Bayar -->
      <div class="border-t border-slate-100 pt-4 shrink-0 bg-white pb-16 lg:pb-0">
        <div class="flex justify-between items-center mb-4">
          <span class="text-xs text-slate-500 font-medium" id="jml-item-cart">0 Item</span>
          <span class="font-bold text-slate-900 text-lg text-blue-600" id="total-harga">Rp 0</span>
        </div>
        <button onclick="prosesBayar()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-2xl text-xs transition cursor-pointer shadow-lg shadow-blue-500/25">Proses Pembayaran</button>
        <button onclick="logout()" class="lg:hidden w-full mt-2.5 bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-3 rounded-2xl text-xs transition cursor-pointer">Keluar Sistem</button>
      </div>
    </div>

  </div>

  <!-- Nota Tersembunyi untuk Print -->
  <div id="printable-receipt" class="hidden fixed inset-0 bg-white p-8 z-50 text-black">
    <h3 class="text-center font-bold text-sm">Aquarium & Petshop 99</h3>
    <p class="text-center text-[10px] text-slate-500 mb-4">Jl. Utama No. 99</p>
    <div class="flex justify-between text-[10px] border-b border-dashed border-slate-400 pb-2 mb-2">
      <span id="nota-tanggal">-</span>
      <span id="nota-id">-</span>
    </div>
    <div id="nota-items" class="space-y-1 text-xs mb-4"></div>
    <div class="border-t border-dashed border-slate-400 pt-2 flex justify-between font-bold text-xs mb-6">
      <span>Total:</span>
      <span id="nota-total">Rp 0</span>
    </div>
    <p class="text-center text-[10px]">Terima Kasih Atas Kunjungan Anda!</p>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      checkAuth('kasir');
      renderKasirProduk();
      updateKeranjangUI();
    });

    function gantiTabMobile(tab) {
      const panelProduk = document.getElementById('panel-produk');
      const panelKeranjang = document.getElementById('panel-keranjang');
      const btnProduk = document.getElementById('tab-btn-produk');
      const btnKeranjang = document.getElementById('tab-btn-keranjang');

      if (tab === 'produk') {
        panelProduk.classList.remove('hidden');
        panelKeranjang.classList.add('hidden');
        btnProduk.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white transition";
        btnKeranjang.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 transition relative";
      } else {
        panelProduk.classList.add('hidden');
        panelKeranjang.classList.remove('hidden');
        panelKeranjang.classList.add('flex');
        btnKeranjang.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white transition relative";
        btnProduk.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 transition";
      }
    }
  </script>
</body>
</html>
